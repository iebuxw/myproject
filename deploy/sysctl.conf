# Linux 宿主机内核参数 — 仅包含容器内无法设置的项
# 网络参数（somaxconn、tcp_tw_reuse 等）已在 docker-compose.yml 的 sysctls 中按容器设置
# 使用方式：复制到宿主机 /etc/sysctl.d/99-app.conf，然后 sysctl -p /etc/sysctl.d/99-app.conf

# 系统级文件句柄上限（所有进程共享）
fs.file-max = 1048576

# 尽量不用 Swap，避免内存换盘导致服务卡顿（MySQL/Redis 雪崩）
vm.swappiness = 1

# 允许内存过量分配，Redis BGSAVE fork 时需要（否则 OOM 杀进程）
vm.overcommit_memory = 1
