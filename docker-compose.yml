services:
  # ==================== Nginx ====================
  nginx:
    build:
      context: .
      dockerfile: services/nginx/Dockerfile
    container_name: nginx
    ports:
      - "80:80"
    depends_on:
      - php
      - go
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ./services/nginx/logs:/var/log/nginx
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network
    restart: unless-stopped

  # ==================== PHP ====================
  php:
    build:
      context: .
      dockerfile: services/php/Dockerfile
    container_name: php
    volumes:
      - ./services/php/app/application:/var/www/html/application
      - ./services/php/app/config:/var/www/html/config
      - ./services/php/app/route:/var/www/html/route
      - ./services/php/app/public:/var/www/html/public
      - ./services/php/app/runtime/log:/var/www/html/runtime/log
      - /proc:/host_proc:ro
    cap_add:
      - SYS_PTRACE
    depends_on:
      - mysql
      - redis
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASS: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_DEBUG: ${APP_DEBUG:-0}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network
    restart: unless-stopped

  # ==================== Go API ====================
  go:
    build: ./services/go
    container_name: go
    depends_on:
      - mysql
      - redis
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASS: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      GO_PORT: ${GO_PORT}
      APP_DEBUG: ${APP_DEBUG:-0}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network
    restart: unless-stopped

  # ==================== MySQL ====================
  mysql:
    build:
      context: .
      dockerfile: services/mysql/Dockerfile
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./services/mysql/init:/docker-entrypoint-initdb.d:ro
      - ./services/mysql:/scripts:ro
    command: --skip-host-cache --skip-name-resolve --default-time-zone=+08:00
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==================== Redis ====================
  redis:
    build:
      context: .
      dockerfile: services/redis/Dockerfile
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./services/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:

networks:
  app-network:
    driver: bridge
